[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "optiforge"
version = "1.0.0"
description = "OptiForge — local generative starting-point lens design (emits .seq files)"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.21",
    "scipy>=1.7",
    "matplotlib>=3.4",
]

[project.optional-dependencies]
web = ["flask>=2.0"]
dev = ["pytest>=7"]

[tool.setuptools]
packages = ["optiforge"]

[tool.setuptools.package-data]
optiforge = ["templates/*.html", "static/*.html"]

[project.scripts]
optiforge = "optiforge.cli:main"
